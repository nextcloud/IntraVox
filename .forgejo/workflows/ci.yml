# The quality gate, on the remote that actually receives our pushes.
#
# .github/workflows/ci.yml is the same gate for the public GitHub mirror. This
# file exists because day-to-day work goes to forgejo.voxcloud.nl, so the GitHub
# copy only runs when a release is pushed there — far too late to catch a
# broken commit.
#
# Runner notes, checked against voxcloud-srv-runner-1 rather than assumed:
#   - the job image is catthehacker/ubuntu:act-22.04. It has Node 24 but NO php
#     and NO composer, so PHP is installed per run via setup-php.
#   - job containers run on proxy-net, so they do reach the internet and the
#     instance; see /opt/docker/forgejo-runner/README.md for why not the
#     internal network.
#   - the runner cache IS enabled, unlike on the old ax42 runner.
#
# Kept deliberately close to the GitHub file so the two do not drift. When you
# change one, change the other.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        # Twee afwijkingen van de GitHub-versie, allebei nodig:
        #
        # 1. Volledige URL. Forgejo zoekt een kale `owner/repo` op
        #    data.forgejo.org en setup-php staat daar niet (checkout en
        #    setup-node wél) -- anders "repository not found".
        # 2. Vastgezet op 2.33.0. De v2-tag draait inmiddels op node24 en
        #    forgejo-runner 6.4.0 kent maximaal node20; met @v2 faalt de job
        #    op "runs.using ... got node24". 2.33.0 is de laatste node20-tag.
        #
        # Bij een runner-upgrade mag dit weer @v2 worden.
        uses: https://github.com/shivammathur/setup-php@2.33.0
        with:
          # composer.json says ">=8.2": build on the lowest version we claim to
          # support, so syntax newer than our own floor fails here.
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # Lint before installing, so a parse error is reported as a parse error
      # rather than as a confusing autoloader failure during composer install.
      - name: Syntax-check all PHP sources
        run: |
          set -euo pipefail
          find lib tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install composer dependencies
        env:
          # composer leest dit rechtstreeks uit de omgeving, zonder
          # auth.json. Dat is hier nodig omdat actions/checkout HOME per
          # stap tijdelijk verzet ("Temporarily overriding HOME=..."), zodat
          # een `composer config -g` in een eerdere stap in een andere
          # home belandt dan de install-stap leest -- het token werd dan
          # netjes gezet en vervolgens genegeerd.
          # PAT_GITHUB is een scope-loos classic token (org-secret voxcloud-apps).
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.PAT_GITHUB }}"}}'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Unit tests
        run: composer run test:unit

      # QG-2. Level 5 against a baseline of 299 pre-existing errors: new and
      # refactored code must be clean, and the baseline may only ever shrink.
      # Runs after the tests because a type error is easier to read once you
      # know the suite itself is green.
      - name: Static analysis
        run: composer run lint:phpstan

  packaging:
    name: Packaging guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The guard protects the release contract, so it must itself be known
      # good. Three tarballs: one correct, one without vendor/ (the shape 2.2.0
      # shipped in) and one carrying a dev dependency. A guard that cannot fail
      # proves nothing.
      - name: Self-test the packaging guard
        run: |
          set -euo pipefail
          work="$(mktemp -d)"

          make_pkg() { # $1=name  $2=vendor|novendor|devvendor
            local root="$work/$1/intravox"
            mkdir -p "$root/appinfo" "$root/lib/AppInfo"
            touch "$root/appinfo/info.xml" "$root/lib/AppInfo/Application.php"
            if [ "$2" != "novendor" ]; then
              mkdir -p "$root/vendor/enshrined/svg-sanitize/src" "$root/vendor/lsolesen/pel/src"
              touch "$root/vendor/autoload.php" \
                    "$root/vendor/enshrined/svg-sanitize/src/Sanitizer.php" \
                    "$root/vendor/lsolesen/pel/src/Pel.php"
            fi
            if [ "$2" = "devvendor" ]; then
              mkdir -p "$root/vendor/phpunit/phpunit"
              touch "$root/vendor/phpunit/phpunit/phpunit.php"
            fi
            tar -czf "$work/$1.tar.gz" -C "$work/$1" intravox
          }

          make_pkg good vendor
          make_pkg novendor novendor
          make_pkg devvendor devvendor

          echo "--- a correct package must be accepted"
          ./scripts/check-package-contents.sh "$work/good.tar.gz"

          echo "--- a package without vendor/ must be rejected"
          if ./scripts/check-package-contents.sh "$work/novendor.tar.gz"; then
            echo "FAIL: the guard accepted a package with no vendor/" >&2
            exit 1
          fi

          echo "--- a package carrying dev dependencies must be rejected"
          if ./scripts/check-package-contents.sh "$work/devvendor.tar.gz"; then
            echo "FAIL: the guard accepted a package containing phpunit" >&2
            exit 1
          fi

          echo "Packaging guard behaves correctly in all three cases."

  frontend:
    name: Frontend guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The job image ships Node 24; these guards are dependency-free plain
      # Node, so there is no npm install and nothing to cache.
      - name: Import consistency
        run: node scripts/check-import-consistency.js

      - name: Facet serialization
        run: node scripts/check-facet-serialization.js

      - name: Line endings
        run: node scripts/check-eol-consistency.js

      - name: File budgets (ratchet)
        run: node scripts/check-file-budgets.js

      - name: Security markers
        run: node scripts/check-security-markers.js

      - name: Route table is current
        run: node scripts/generate-route-table.js --check

      - name: OpenAPI coverage ratchet
        run: node scripts/check-openapi.js
