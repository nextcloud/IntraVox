# Forgejo Actions: the IntraVox INTEGRATION suite against a real Nextcloud.
#
# Why this exists
# ---------------
# The unit suite stubs OCP away, and that is exactly where this app has broken.
# The PageService split shipped an intranet with NO PAGES AT ALL while 1321 unit
# tests stayed green: FolderContext resolved the user's home folder instead of
# the mounted IntraVox groupfolder, because the DI container filled a TEST-ONLY
# seam that the unit suite always injects by hand. A second defect in the same
# class made every occ command fail. Neither is reachable from a mocked test.
#
# tests/Integration exists to catch precisely that, and until now it ran in one
# place only: a developer's laptop with an SSH key to nc-dev. So it did not run.
#
# What is different here from scripts/run-integration-tests.sh
# ------------------------------------------------------------
# That script drives the suite inside the live dev container. This installs a
# THROWAWAY Nextcloud in the runner, which makes the suite a gate rather than a
# ritual, and removes the two problems the script cannot avoid: it needs SSH to
# a shared server, and it leaves a DEV vendor/ behind on a machine that outlives
# the run. Both keep their use: the script tests against real content, this
# tests against a clean install.
#
# The dev-vendor shadowing problem is NOT solved by throwing the server away --
# it bites during the job. The app's vendor/ sits ahead of the server's
# 3rdparty/ on the autoload path, so sabre/xml 4.x breaks CalDAV and
# symfony/console 6.4 breaks occ on NC35. The install step therefore swaps in a
# --no-dev vendor for everything that boots Nextcloud, and swaps the dev tree
# back for phpunit.
#
# The suite needs groupfolders. Every test builds a throwaway groupfolder, so
# without that app IntegrationTestCase skips the whole suite with an explanation
# rather than erroring -- which is why a missing app here reads as "skipped", not
# as a broken run. groupfolders tracks the server's stableNN branches.
#
# Scope: sqlite only, and only the NC versions info.xml actually claims (32-35).
# IntraVox's integration tests exercise folder resolution, ACLs and mounts --
# nothing DB-specific -- so a three-database matrix would triple the runtime to
# re-prove the same thing. FormVox does run one, because its tests hit real DB
# locks and filecache behaviour.
#
# Runner notes, same constraints as ci.yml (checked against voxcloud-srv-runner-1):
#   - image catthehacker/ubuntu:act-22.04: Node, but no PHP and no composer.
#   - actions resolve from data.forgejo.org, where shivammathur/setup-php is
#     absent -- so PHP comes from ondrej/php on the host.
#   - actions/checkout clones from the LOCAL instance, so nextcloud/server and
#     groupfolders are cloned from GitHub explicitly.

name: Integration

on:
  # Not on every push: this installs a full Nextcloud per matrix entry, which is
  # minutes rather than seconds. The fast gate in ci.yml runs on every branch;
  # this runs where it pays off -- before something lands on a main line, and on
  # demand while working on the folder/ACL code it protects.
  pull_request:
  push:
    # integration/3.0 is here on purpose and comes OUT once 3.0 has merged.
    # Without it this workflow could not run at all before the merge: push
    # ignores the branch, and Forgejo only offers the workflow_dispatch button
    # for workflows present on the default branch. It would first execute at
    # the moment it matters most, which is how the branch filter in ci.yml let
    # 52 commits through ungated.
    branches: [main, master, integration/3.0]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: NC ${{ matrix.server }} / php ${{ matrix.php }} / sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # info.xml says min-version 32, max-version 35. Both ends are claims:
        # phpstan proves the LOWER bound statically (nextcloud/ocp is pinned to
        # v32.0.9), and nothing proved the upper bound at all until this matrix.
        include:
          # PHP per NC version, read from each branch's lib/versioncheck.php
          # rather than assumed: 32 needs 8.1+, 33/34 need 8.2+, and 35 needs
          # 8.3 -- it refuses to install on 8.2 with "This version of Nextcloud
          # requires at least PHP 8.3", which is what killed every stable35 run.
          #
          # 8.2 stays where it can, because that is the floor composer.json
          # claims and the version ci.yml pins; building on it is how syntax
          # newer than our own floor gets caught.
          - { server: stable32, php: '8.2' }
          - { server: stable33, php: '8.2' }
          - { server: stable34, php: '8.2' }
          - { server: stable35, php: '8.3' }

    steps:
      - name: Install PHP ${{ matrix.php }} + Composer
        # 8.2 is the floor composer.json claims, matching ci.yml. Building on
        # the lowest supported version means syntax newer than our own floor
        # fails here rather than in a user's logs.
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates curl unzip git >/dev/null
          add-apt-repository -y ppa:ondrej/php >/dev/null
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            php${{ matrix.php }}-cli php${{ matrix.php }}-xml php${{ matrix.php }}-mbstring php${{ matrix.php }}-zip php${{ matrix.php }}-curl \
            php${{ matrix.php }}-gd php${{ matrix.php }}-intl php${{ matrix.php }}-bcmath php${{ matrix.php }}-gmp php${{ matrix.php }}-sqlite3 >/dev/null
          curl -sS https://getcomposer.org/installer \
            | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Clone Nextcloud server ${{ matrix.server }}
        # NOT actions/checkout: on this runner it resolves bare owner/repo
        # against the local Forgejo instance and fails with "not found".
        # Shallow, with submodules -- 3rdparty is required to boot.
        run: |
          git clone --depth=1 --branch "${{ matrix.server }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/nextcloud/server.git server

      - name: Clone groupfolders ${{ matrix.server }}
        # The suite's whole subject is groupfolder resolution, so this is a hard
        # dependency, not an optional extra. groupfolders follows the server's
        # stableNN naming (23.x on stable35, 22.x on stable32-34).
        #
        # Cloned into a holding area rather than straight into apps/: a git
        # checkout of an app has no vendor/, and Nextcloud scans apps/ during
        # bootstrap. An app whose classes cannot autoload can take occ down
        # before it prints anything, which is exactly the symptom this job had.
        # It moves into place after the server is installed.
        run: |
          git clone --depth=1 --branch "${{ matrix.server }}" \
            https://github.com/nextcloud/groupfolders.git /tmp/groupfolders
          ls /tmp/groupfolders/composer.json 2>/dev/null \
            && echo "groupfolders ships a composer.json (vendor/ needed)" \
            || echo "groupfolders has no composer.json"

      - name: Checkout IntraVox into apps/
        uses: actions/checkout@v4
        with: { path: server/apps/intravox }

      - name: Install IntraVox dev dependencies
        # --dev, because phpunit lives there. This was "safe because the server
        # is thrown away", and that reasoning was wrong: the poisoning happens
        # DURING the job, not after it.
        #
        # The app's vendor/ is on the autoload path ahead of the server's
        # 3rdparty/, so 23 dev packages shadow core libraries -- among them
        # sabre/xml 4.x (the CalDAV fatal we already know) and symfony/console
        # 6.4, which killed every stable35 run with
        #
        #     Call to undefined method Symfony\...\Application::addCommand()
        #
        # NC35 moved to Symfony 7, where that method exists; 32-34 are still on
        # 6.x, which is exactly why only stable35 failed. Nothing to do with
        # this app's code.
        #
        # It does not affect the App Store tarball: composer.lock's production
        # set is enshrined/svg-sanitize and lsolesen/pel, nothing else, and
        # deploy.sh builds vendor/ with --no-dev. This is a CI artefact only.
        working-directory: server/apps/intravox
        # No COMPOSER_AUTH here, unlike ci.yml. Every dependency comes from
        # Packagist as a dist zip -- composer.json declares no vcs repositories
        # and nothing private -- so the token only ever bought a higher GitHub
        # rate limit. Passing it when the secret resolves empty hands composer
        # {"github-oauth":{"github.com":""}}, which it accepts and then exits
        # non-zero on, after doing all the work and printing nothing useful.
        # That is what killed this job: 55 packages installed, autoload
        # generated, then a silent failure with no step 5.
        #
        # The explicit echo is not decoration. The failure above produced no
        # message at all -- no error, no exit code, just a job that stopped --
        # so if this step dies again, the log should at least say where.
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          echo "composer install exited $?"
          echo "pwd: $(pwd)"
          ls -la vendor/bin/ 2>&1 | head -20
          echo "phpunit: $(command -v ./vendor/bin/phpunit || echo MISSING)"

      - name: Install Nextcloud (sqlite)
        working-directory: server
        run: |
          echo "=== step 5 started, pwd: $(pwd) ==="
          # occ produced not a single line before -- not even with --verbose --
          # which means PHP itself gave up before Nextcloud's bootstrap printed
          # anything. Capture that: run it detached from -e, then show the exit
          # code and whatever landed on stderr.
          set +e
          php occ maintenance:install --verbose --database=sqlite \
            --admin-user admin --admin-pass admin > /tmp/occ.out 2>/tmp/occ.err
          rc=$?
          set -e
          echo "occ exit: $rc"
          echo "--- stdout ---"; cat /tmp/occ.out
          echo "--- stderr ---"; cat /tmp/occ.err
          [ "$rc" -eq 0 ] || exit 1

      - name: Enable groupfolders and IntraVox
        working-directory: server
        run: |
          set -e
          # groupfolders moves in only now, with the server already installed,
          # and gets its own dependencies: a bare git checkout has no vendor/.
          mv /tmp/groupfolders apps/groupfolders
          if [ -f apps/groupfolders/composer.json ]; then
            (cd apps/groupfolders && composer install --no-dev --prefer-dist \
              --no-progress --no-interaction)
          fi
          php occ app:enable --force groupfolders
          php occ app:enable --force intravox
          php occ app:list | grep -E 'intravox|groupfolders'

      - name: Set IntraVox up the way it sets itself up
        working-directory: server
        # `occ intravox:setup` -- the app's own provisioning, not a hand-rolled
        # imitation of it.
        #
        # Two rounds were spent building this by hand: create a groupfolder, add
        # a group, grant permissions. Both failed, and the second failure was the
        # instructive one. SetupService does not look for any group with access;
        # it looks for 'IntraVox Admins', 'IntraVox Editors' and 'IntraVox Users'
        # by name (lib/Service/SetupService.php:22-24). A folder owned by an
        # invented 'intravox-ci' group is not a folder this app recognises, so
        # getSharedFolder() fell back to the user home -- reporting 'files' where
        # the test wanted 'IntraVox', which is bug A's exact shape.
        #
        # Calling the app's own setup fixes that and is the better test anyway:
        # provisioning is a code path that ships, so exercising it here means a
        # break in it fails CI rather than a first install. The demo data it
        # imports also gives PageLifecycleTest actual pages to list, which is the
        # other thing a bare server does not have.
        run: |
          set -e
          # occ runs with the app's vendor/ shadowing core libraries, so move
          # the dev tree aside for anything that boots Nextcloud. Restored just
          # before phpunit, which is the only step that needs it.
          mv apps/intravox/vendor apps/intravox/vendor-dev
          composer install --no-dev --prefer-dist --no-progress \
            --no-interaction --working-dir=apps/intravox
          php occ intravox:setup --language en --no-interaction
          php occ groupfolders:list
          php occ intravox:reindex
          rm -rf apps/intravox/vendor
          mv apps/intravox/vendor-dev apps/intravox/vendor

      - name: Integration suite
        working-directory: server/apps/intravox
        # NEXTCLOUD_ROOT is what tests/bootstrap-integration.php reads; its
        # default (/var/www/html) is the container layout, not this one.
        env:
          NEXTCLOUD_ROOT: ${{ github.workspace }}/server
        run: |
          set -o pipefail
          php vendor/bin/phpunit -c phpunit-integration.xml 2>&1 | tee result.txt

          # A skipped suite exits 0. IntegrationTestCase skips when Nextcloud is
          # not bootstrapped or groupfolders is missing, and either would mean
          # this job proved nothing while reporting success -- the exact failure
          # mode that let the suite go unrun for months. So assert it actually
          # ran, rather than trusting the exit code.
          if grep -qE 'No tests executed|Skipped: [0-9]+' result.txt; then
            echo "::error::the integration suite skipped tests instead of running them"
            grep -E 'Skipped|No tests executed' result.txt
            exit 1
          fi
